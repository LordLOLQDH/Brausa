<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b0f"><title>Auron Browser</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0f;color:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}.bar{padding:10px;display:flex;gap:8px;background:#11151c;border-bottom:1px solid #252b35}.btn{border:0;background:#1a2029;color:#fff;border-radius:10px;width:40px;height:40px;font-size:21px}.url{flex:1;min-width:0;border:1px solid #303744;background:#0b0e13;color:#fff;border-radius:12px;padding:0 14px;font-size:15px;outline:0}.tabs{display:flex;padding:6px 8px;background:#0d1016;border-bottom:1px solid #252b35}.tab{background:#171c24;color:#fff;border:1px solid #2a313c;border-radius:9px;padding:9px 14px}.main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}.mark{font-size:64px;font-weight:800}.main h1{font-size:32px;margin:8px}.main p{color:#8f98a6}.search{display:flex;gap:8px;width:min(650px,90vw)}.search input{flex:1;padding:15px;border-radius:12px;border:1px solid #303744;background:#11151c;color:#fff}.search button{border:0;border-radius:12px;padding:0 18px;font-weight:700}.note{max-width:650px;color:#707987;font-size:13px;margin:18px auto}</style>
</head><body>
<div class="bar"><button class="btn" onclick="back()">‹</button><button class="btn" onclick="forward()">›</button><button class="btn" onclick="location.reload()">↻</button><input id="url" class="url" placeholder="Adresse oder Suchbegriff" enterkeyhint="go"><button class="btn" onclick="go()">→</button></div>
<div class="tabs"><div class="tab">Auron Browser</div></div>
<main class="main"><div><div class="mark">A</div><h1>Auron Browser</h1><p>Dein Browser. Deine Oberfläche.</p><form class="search" onsubmit="event.preventDefault();go()"><input id="search" placeholder="Web suchen oder Adresse eingeben"><button>Öffnen</button></form><div class="note">Diese GitHub-Pages-Version nutzt die Web-Plattform des aktuellen Browsers. Eine echte Chromium-Engine kommt später als eigenständige Auron-App.</div></div></main>
<script>
const u=document.getElementById('url'),s=document.getElementById('search');
function normalize(v){v=v.trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v))return 'https://'+v;return 'https://www.google.com/search?q='+encodeURIComponent(v)}
function go(){const v=normalize(u.value||s.value);if(v)location.href=v}
function back(){history.back()}function forward(){history.forward()}
u.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
