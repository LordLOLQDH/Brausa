<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><link rel="manifest" href="manifest.json"><title>Auron Browser</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b10;color:#fff}body{display:flex;flex-direction:column}.toolbar{display:flex;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:#11151d}.btn{border:0;background:#1b212b;color:#fff;border-radius:10px;min-width:38px;height:38px;font-size:20px}.address{flex:1;min-width:0;background:#0b0e14;color:#fff;border:1px solid #303846;border-radius:11px;padding:0 12px}.tabs{display:flex;gap:6px;padding:6px 8px;background:#0d1016;overflow:auto}.tab{border:1px solid #303846;background:#171c25;color:#fff;border-radius:9px;padding:8px 12px}.active{border-color:#9ca6ff}.content{flex:1;min-height:0;position:relative}.home{height:100%;overflow:auto;text-align:center;padding:12vh 18px;background:radial-gradient(circle at 50% 15%,#20283b,#090b10 55%)}.logo{margin:auto;width:72px;height:72px;border:2px solid #a3adff;border-radius:20px;display:grid;place-items:center;font-size:40px;font-weight:800}.home h1{font-size:32px;margin:16px 0 5px}.muted{color:#9099a8}.search{display:flex;gap:8px;max-width:700px;margin:24px auto}.search input{flex:1;height:50px;border-radius:14px;border:1px solid #303846;background:#11151d;color:#fff;padding:0 15px}.search button{border:0;border-radius:14px;padding:0 18px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:700px;margin:auto}.card{text-align:left;border:1px solid #29313d;background:#121821;color:#fff;border-radius:14px;padding:15px}.card small{display:block;color:#9099a8;margin-top:4px}.frame{width:100%;height:100%;border:0;background:#fff}.notice{position:absolute;z-index:3;left:10px;right:10px;top:10px;padding:12px;border-radius:12px;background:#171d27ee;border:1px solid #374151;font-size:13px}.hidden{display:none!important}.status{height:28px;padding:5px 10px;background:#11151d;border-top:1px solid #252c37;color:#8e97a5;font-size:12px}</style></head><body><header class="toolbar"><button class="btn" id="back">‹</button><button class="btn" id="forward">›</button><button class="btn" id="reload">↻</button><form id="nav" style="display:flex;flex:1;min-width:0"><input id="address" class="address" placeholder="Adresse oder Suche" autocomplete="off"></form><button class="btn" id="home">⌂</button><button class="btn" id="menu">⋮</button></header><div class="tabs"><button class="tab active">Auron Browser</button><button class="btn" id="new">+</button></div><main class="content"><section id="homePage" class="home"><div class="logo">A</div><h1>Auron Browser</h1><div class="muted">Schnell. Privat. Auron.</div><form id="search" class="search"><input id="query" placeholder="Web suchen oder Adresse eingeben"><button>Öffnen</button></form><div class="cards"><button class="card" data-url="https://www.wikipedia.org/"><b>Wikipedia</b><small>Wissen</small></button><button class="card" data-url="https://github.com/"><b>GitHub</b><small>Entwicklung</small></button><button class="card" data-url="https://developer.mozilla.org/"><b>MDN</b><small>Webentwicklung</small></button><button class="card" data-url="https://example.com/"><b>Example</b><small>Testseite</small></button></div><p class="muted" style="max-width:700px;margin:18px auto;font-size:13px">Auron Web-Version. Fremde Websites können das Einbetten per Sicherheitsrichtlinie blockieren. Für echte Browser-Navigation folgt die native Chromium-Version.</p></section><section id="browser" class="hidden" style="height:100%;position:relative"><div id="notice" class="notice hidden"></div><iframe id="frame" class="frame" allow="fullscreen;clipboard-read;clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
