<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="description" content="Auron Browser – mobile Web-App mit Auron API">
<link rel="manifest" href="manifest.json">
<title>Auron Browser</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b10;color:#fff}
body{display:flex;flex-direction:column}
button,input{font:inherit}
.toolbar{display:flex;gap:6px;padding:8px;padding-top:max(8px,env(safe-area-inset-top));background:#11151d;border-bottom:1px solid #252c37}
.btn{border:1px solid #303846;background:#1b212b;color:#fff;border-radius:10px;min-width:38px;height:38px;font-size:20px}
.btn:active,.tab:active,.card:active{transform:scale(.97)}
.address{flex:1;min-width:0;background:#0b0e14;color:#fff;border:1px solid #303846;border-radius:11px;padding:0 12px;outline:none}
.address:focus{border-color:#8f9aff}
.tabs{display:flex;gap:6px;padding:6px 8px;background:#0d1016;overflow:auto;border-bottom:1px solid #202631}
.tab{border:1px solid #303846;background:#171c25;color:#fff;border-radius:9px;padding:8px 12px;white-space:nowrap}
.active{border-color:#9ca6ff}
.content{flex:1;min-height:0;position:relative}
.home{height:100%;overflow:auto;text-align:center;padding:9vh 18px 30px;background:radial-gradient(circle at 50% 15%,#20283b,#090b10 55%)}
.logo{margin:auto;width:72px;height:72px;border:2px solid #a3adff;border-radius:20px;display:grid;place-items:center;font-size:40px;font-weight:800}
.home h1{font-size:32px;margin:16px 0 5px}
.muted{color:#9099a8}
.search{display:flex;gap:8px;max-width:700px;margin:24px auto 12px}
.search input{flex:1;height:50px;border-radius:14px;border:1px solid #303846;background:#11151d;color:#fff;padding:0 15px;outline:none}
.search button{border:0;border-radius:14px;padding:0 18px;font-weight:700}
.api-hint{font-size:12px;color:#7f8999;margin:0 auto 20px;max-width:650px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:700px;margin:auto}
.card{text-align:left;border:1px solid #29313d;background:#121821;color:#fff;border-radius:14px;padding:15px}
.card small{display:block;color:#9099a8;margin-top:4px}
.panel{max-width:700px;margin:18px auto 0;text-align:left;border:1px solid #29313d;background:#111720;border-radius:14px;padding:14px}
.panel h3{margin:0 0 10px}
.result{white-space:pre-wrap;word-break:break-word;color:#dce2ed;font-size:13px;line-height:1.45}
.frame{width:100%;height:100%;border:0;background:#fff}
.notice{position:absolute;z-index:3;left:10px;right:10px;top:10px;padding:12px;border-radius:12px;background:#171d27ee;border:1px solid #374151;font-size:13px}
.hidden{display:none!important}
.status{height:28px;padding:5px 10px;background:#11151d;border-top:1px solid #252c37;color:#8e97a5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.external{position:absolute;z-index:4;right:10px;bottom:10px;border:1px solid #374151;background:#111720ee;color:#fff;border-radius:10px;padding:9px 12px}
</style>
</head>
<body>
<header class="toolbar">
<button class="btn" id="back" aria-label="Zurück">‹</button>
<button class="btn" id="forward" aria-label="Vorwärts">›</button>
<button class="btn" id="reload" aria-label="Neu laden">↻</button>
<form id="nav" style="display:flex;flex:1;min-width:0">
<input id="address" class="address" placeholder="Adresse oder Suche" autocomplete="off" autocapitalize="none" spellcheck="false">
</form>
<button class="btn" id="home" aria-label="Startseite">⌂</button>
<button class="btn" id="menu" aria-label="Menü">⋮</button>
</header>

<div class="tabs">
<button class="tab active">Auron Browser</button>
<button class="btn" id="new" aria-label="Neue Seite">+</button>
</div>

<main class="content">
<section id="homePage" class="home">
<div class="logo">A</div>
<h1>Auron Browser</h1>
<div class="muted">Schnell. Privat. Auron.</div>

<form id="search" class="search">
<input id="query" placeholder="Web suchen oder Adresse eingeben" autocomplete="off">
<button>Öffnen</button>
</form>

<div class="api-hint">
Auron-Schnellbefehle: <b>weather Berlin</b> · <b>wiki Deutschland</b> · <b>github chromium</b> · <b>country Germany</b> · <b>convert 100 EUR USD</b>
</div>

<div class="cards">
<button class="card" data-command="wiki Deutschland"><b>Wikipedia</b><small>Wissen über Auron API</small></button>
<button class="card" data-command="github chromium"><b>GitHub</b><small>Repositories über Auron API</small></button>
<button class="card" data-command="weather Berlin"><b>Wetter</b><small>Aktuelles Wetter</small></button>
<button class="card" data-command="country Germany"><b>Länder</b><small>Länderinformationen</small></button>
</div>

<div id="apiPanel" class="panel hidden">
<h3 id="apiTitle">Auron API</h3>
<div id="apiResult" class="result"></div>
</div>
</section>

<section id="browser" class="hidden" style="height:100%;position:relative">
<div id="notice" class="notice hidden"></div>
<iframe id="frame" class="frame" allow="fullscreen;clipboard-read;clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<button id="external" class="external hidden">Extern öffnen</button>
</section>
</main>

<footer id="status" class="status">Auron bereit</footer>
<script src="app.js"></script>
</body>
</html>
